org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
# On domestic internet without VPN, increase timeouts so slow mirrors have time to respond.
# Safe on fast networks too — just gives more breathing room on the first sync.
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
